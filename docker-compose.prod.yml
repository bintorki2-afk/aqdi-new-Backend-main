###############################################################################
# Aqdi Backend — production compose (app + mysql + nginx)
#
#   1. cp .env.example .env   (fill DB_* and your integration keys)
#   2. Set APP_KEY BEFORE the first boot (the entrypoint caches config on start):
#        docker run --rm -v "$PWD:/app" -w /app php:8.2-cli php -r 'echo "base64:".base64_encode(random_bytes(32)).PHP_EOL;'
#      and paste the value into .env as APP_KEY=...
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. docker compose -f docker-compose.prod.yml exec app php artisan db:seed --force
#      (or the lookup-only seeder list in DEPLOY.md §4)
#   If you change .env later: docker compose -f docker-compose.prod.yml restart app
#
# The app container's entrypoint runs migrate --force + config/route/view cache.
###############################################################################
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    networks:
      - aqdi

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve the same code the app container built (static assets under /public)
      - ./public:/var/www/html/public:ro
      # Uploaded files live in the app's storage volume; nginx serves /storage/* from it directly
      - storage:/var/www/html/storage:ro
    networks:
      - aqdi

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-aqdi}"
      MYSQL_USER: "${DB_USERNAME:-aqdi}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aqdi

  # Optional: queue worker (enable if QUEUE_CONNECTION != sync)
  # queue:
  #   build: { context: ., dockerfile: Dockerfile }
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on: [db]
  #   command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
  #   volumes: [ "storage:/var/www/html/storage" ]
  #   networks: [ aqdi ]

volumes:
  dbdata:
  storage:

networks:
  aqdi:
    driver: bridge
