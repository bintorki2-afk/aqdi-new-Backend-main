server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Public uploads (php artisan storage:link target). The `storage` named volume is
    # mounted read-only into this container so /storage/* resolves without a host symlink.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        # never execute anything uploaded
        location ~ \.php$ { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "app" is the php-fpm service name in docker-compose.prod.yml
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
